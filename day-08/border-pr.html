<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>border</title>
    <style>
      * {
        box-sizing: border-box;
        padding: 0;
        margin: 0;
      }
      .div{
        margin: 20px;
        padding: 20px;
      }
      .div1{
        border: 2px solid black;
      }
      .div3{
        border: 2px dashed black;
      }
      .div4{
        border: 2px dotted black;
      }
      .div5{
        border: 5px double black;
      }
      .div6{
        border-bottom:2px solid black; 
      }
      .div7{
        border-left:5px solid blue
      }
      .div8{
        border: 2px solid black;
        border-radius: 50px;
      }
    </style>
  </head>
  <body>
    <h1>Css Border Example</h1>

    <div class="div div1">This is a box with a border.</div>
    <div class="div div2">This is a box with a border.</div>
    <div class="div div3">This is a box with a border.</div>
    <div class="div div4">This is a box with a border.</div>
    <div class="div div5">This is a box with a border.</div>
    <div class="div div6">This is a box with a border.</div>
    <div class="div div7">This is a box with a border.</div>
    <div class="div div8">This is a box with a border.</div>
  </body>
</html>
