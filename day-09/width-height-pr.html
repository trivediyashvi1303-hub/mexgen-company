<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>height-width</title>
    <style>
        *{
            margin: 0;
            padding: 0;
        }
        body{
            background-color: rgb(238, 247, 216);;
        }
        div{
            margin: 20px;
        }
        .box{
            width: 200px;
            height: 100px;
            background-color: lightblue;
        }
        .parent{
            width: 400px;
            height: 200px;
            background-color: lightgrey;
        }
        .child{
            width: 50%;
            height: 50%;
            background-color: lightgreen;
        }
        .banner{
            width: 100vw;
            height: 50vh;
            background-color: orange;
        }
        .box1{
            width: auto;
            height: auto;
            background-color: lightpink;
            padding: 20px;
        }
    </style>
</head>
<body>
    <div class="box">200px x 100px</div>
    <div class="parent">
        <div class="child">50% x 50%</div>
    </div>
    <div class="banner">Full viewport width, half viewport height</div>
    <div class="box1">This box uses automatic width and height.</div>
</body>
</html>
