<!-- 1. Content

The actual content inside the element, such as text, an image, or a button label. The CSS width and height normally specify the content size by default.

2. Padding

The space between the content and the border. Padding is inside the element and shows the element's background.

3. Border

The visible edge around the content and padding. It can have a color, width, and style.

4. Margin

The outside spacing around the border that separates the element from neighboring content. -->

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      .box {
        width: 200px;
        height: 100px;
        padding: 20px;
        border: 5px solid green;
        margin: 30px;
        background-color: lightblue;
      }
    </style>
  </head>
  <body>
    <div class="box">Hello World!</div>
  </body>
</html>
